# BORRADOR sin probar: ajusta runtime-version al GNOME vigente y rellena los sha256.
app-id: io.github.Gustavomagno18.Hasu
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: hasu

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri

modules:
  # 1) ani-cli-mx (script de shell, GPL). Fija un commit o tag al publicar.
  - name: ani-cli-mx
    buildsystem: simple
    build-commands:
      - install -Dm755 ani-cli-mx-core /app/libexec/ani-cli-mx
      - install -Dm755 ani-cli-mx /app/bin/ani-cli-mx
    sources:
      - type: git
        url: https://github.com/Gildedboy/ani-cli-mx.git
        branch: main

  # 2) yt-dlp (opcional pero recomendado): genera el módulo con flatpak-pip-generator
  #    o descarga el binario oficial con su sha256.
  # - name: yt-dlp
  #   buildsystem: simple
  #   build-commands:
  #     - install -Dm755 yt-dlp /app/bin/yt-dlp
  #   sources:
  #     - type: file
  #       url: https://github.com/yt-dlp/yt-dlp/releases/download/<VERSION>/yt-dlp
  #       sha256: <SHA256>

  # 3) mpv: el sandbox no lo trae. Copia el módulo de mpv (y libplacebo/libass/ffmpeg)
  #    del manifiesto de io.mpv.Mpv en Flathub, o ver el README para otras opciones.

  # 4) la interfaz
  - name: hasu
    buildsystem: simple
    build-commands:
      - install -d /app/share/hasu
      - cp -r animx /app/share/hasu/
      - install -Dm755 bin/hasu /app/bin/hasu
      - install -Dm644 data/io.github.Gustavomagno18.Hasu.desktop -t /app/share/applications
      - install -Dm644 data/io.github.Gustavomagno18.Hasu.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/io.github.Gustavomagno18.Hasu.svg -t /app/share/icons/hicolor/scalable/apps
    sources:
      - type: dir
        path: .
